
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin KAWANEE</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f2;color:#20352a;margin:0;padding:16px}
main{max-width:760px;margin:auto}
section{background:white;padding:18px;margin:16px 0;border-radius:12px}
input,textarea,select{box-sizing:border-box;width:100%;padding:12px;margin:7px 0 14px;border:1px solid #bbb;border-radius:6px;font:inherit}
button{padding:11px 15px;border:0;border-radius:6px;background:#246b45;color:white;font-size:15px;cursor:pointer;margin:4px 0}
button:disabled{opacity:.6;cursor:wait}
.danger{background:#a52b2b}
.item{border-top:1px solid #ddd;padding:12px 0;overflow-wrap:anywhere}
small{color:#53645a}
</style>
</head>
<body>
<main>
<h1>Admin KAWANEE</h1>
<p>Kelola informasi dan kegiatan organisasi.</p>

<section id="loginSection">
<h2>Login Pengurus</h2>
<form id="loginForm">
<label>Email admin</label>
<input id="email" type="email" autocomplete="username" required>
<label>Kata sandi</label>
<input id="password" type="password" autocomplete="current-password" required>
<button id="loginButton" type="submit">Masuk</button>
</form>
<p id="status" role="status">Menyiapkan sistem...</p>
</section>

<div id="panel" hidden>
<section>
<p id="welcome"></p>
<button id="logout" type="button">Keluar</button>
</section>

<section>
<h2>Tambah Informasi</h2>
<form id="infoForm">
<label>Judul informasi</label>
<input id="infoTitle" maxlength="150" required>
<label>Isi informasi</label>
<textarea id="infoBody" rows="4" maxlength="10000" required></textarea>
<button type="submit">Simpan Informasi</button>
</form>
</section>

<section>
<h2>Tambah Kegiatan</h2>
<form id="activityForm">
<label>Nama kegiatan</label>
<input id="activityTitle" maxlength="150" required>
<label>Tanggal kegiatan</label>
<input id="activityDate" type="date" required>
<label>Deskripsi kegiatan</label>
<textarea id="activityBody" rows="4" maxlength="10000" required></textarea>
<label>Foto kegiatan</label>
<input id="activityPhoto" type="file" accept="image/jpeg,image/png,image/webp">
<img id="photoPreview" alt="Pratinjau foto" hidden style="max-width:100%;max-height:240px;border-radius:8px">
<small>Pilih foto JPG, PNG, atau WebP dari galeri HP. Maksimal 5 MB.</small>
<button type="submit">Simpan Kegiatan</button>
</form>
</section>

<section>
<h2>Informasi Tersimpan</h2>
<div id="infoList">Memuat data...</div>
</section>

<section>
<h2>Kegiatan Tersimpan</h2>
<div id="activityList">Memuat data...</div>
</section>
</div>
</main>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut,
  setPersistence,
  browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD0j1Xu-1ZHUotuqWBlTc8WkN7NUsd_V1g",
  authDomain: "kawanee-website.firebaseapp.com",
  projectId: "kawanee-website",
  storageBucket: "kawanee-website.firebasestorage.app",
  messagingSenderId: "285839151481",
  appId: "1:285839151481:web:02f2ed0a52f162ed7adfa8"
};

const ADMIN_UID = "tbv7AC93oaMA7WigsVO858XpHeE2";

// Pastikan CLOUD_NAME adalah Cloud name sebenarnya dari dashboard Cloudinary.
const CLOUD_NAME = "tjbg7cft";
const UPLOAD_PRESET = "kawanee_galeri";

const $ = id => document.getElementById(id);
const loginSection = $("loginSection");
const loginForm = $("loginForm");
const loginButton = $("loginButton");
const panel = $("panel");
const status = $("status");
const photoInput = $("activityPhoto");
const photoPreview = $("photoPreview");

let auth;
let db;
let authReady = false;
let handlingAuth = false;

function showError(error, prefix) {
  console.error(prefix, error);
  const code = error?.code || "unknown";
  status.textContent = prefix + " (" + code + ").";
}

try {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getFirestore(app);

  await setPersistence(auth, browserLocalPersistence);

  status.textContent = "Silakan login sebagai admin.";

  loginForm.addEventListener("submit", async event => {
    event.preventDefault();
    if (loginButton.disabled) return;

    loginButton.disabled = true;
    status.textContent = "Memeriksa akun...";

    try {
      await signInWithEmailAndPassword(
        auth,
        $("email").value.trim(),
        $("password").value
      );
      status.textContent = "Login berhasil. Memeriksa akses admin...";
    } catch (error) {
      showError(error, "Login gagal");
    } finally {
      loginButton.disabled = false;
    }
  });

  onAuthStateChanged(auth, async user => {
    if (handlingAuth) return;
    handlingAuth = true;

    try {
      if (!user) {
        panel.hidden = true;
        loginSection.hidden = false;
        if (authReady) status.textContent = "Silakan login sebagai admin.";
        authReady = true;
        return;
      }

      if (user.uid !== ADMIN_UID) {
        panel.hidden = true;
        loginSection.hidden = false;
        status.textContent =
          "Akses ditolak: UID akun ini tidak cocok dengan UID admin yang diatur.";
        await signOut(auth);
        return;
      }

      loginSection.hidden = false;
      panel.hidden = false;
      loginSection.hidden = true;

      $("welcome").textContent = "Login sebagai admin: " + (user.email || "");
      status.textContent = "Admin terverifikasi.";

      authReady = true;
      await loadContent();
    } catch (error) {
      showError(error, "Gagal memeriksa sesi atau memuat data");
    } finally {
      handlingAuth = false;
    }
  });

  $("logout").addEventListener("click", async () => {
    try {
      await signOut(auth);
      loginForm.reset();
      status.textContent = "Anda telah keluar.";
    } catch (error) {
      showError(error, "Gagal keluar");
    }
  });

  function safeText(tag, value) {
    const el = document.createElement(tag);
    el.textContent = value ?? "";
    return el;
  }

  async function loadCollection(name, listId) {
    const list = $(listId);
    list.replaceChildren();

    try {
      const snap = await getDocs(collection(db, name));

      if (snap.empty) {
        list.textContent = "Belum ada data.";
        return;
      }

      snap.forEach(snapshot => {
        const data = snapshot.data();
        const item = document.createElement("div");
        item.className = "item";

        item.append(
          safeText("h3", data.judul || data.title || "(Tanpa judul)"),
          safeText("p", data.isi || data.deskripsi || ""),
          safeText("small", data.tanggal || "")
        );

        if (data.foto) {
          const link = document.createElement("a");
          link.href = data.foto;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "Lihat foto";
          item.append(document.createElement("br"), link);
        }

        const del = document.createElement("button");
        del.className = "danger";
        del.textContent = "Hapus";

        del.addEventListener("click", async () => {
          if (!confirm("Yakin ingin menghapus konten ini?")) return;

          try {
            await deleteDoc(doc(db, name, snapshot.id));
            await loadContent();
          } catch (error) {
            console.error(error);
            alert("Gagal menghapus. Periksa Firestore Rules.");
          }
        });

        item.append(document.createElement("br"), del);
        list.append(item);
      });
    } catch (error) {
      console.error("Gagal memuat koleksi:", name, error);
      list.textContent =
        "Gagal memuat data. Periksa koneksi dan Firestore Rules.";
    }
  }

  async function loadContent() {
    await loadCollection("informasi", "infoList");
    await loadCollection("kegiatan", "activityList");
  }

  $("infoForm").addEventListener("submit", async event => {
    event.preventDefault();

    try {
      await addDoc(collection(db, "informasi"), {
        judul: $("infoTitle").value.trim(),
        isi: $("infoBody").value.trim(),
        dibuatPada: serverTimestamp()
      });

      event.target.reset();
      alert("Informasi berhasil disimpan.");
      await loadContent();
    } catch (error) {
      console.error(error);
      alert("Gagal menyimpan informasi. Periksa Firestore Rules.");
    }
  });

  photoInput.addEventListener("change", () => {
    const file = photoInput.files[0];

    if (!file) {
      photoPreview.hidden = true;
      photoPreview.removeAttribute("src");
      return;
    }

    const allowed = ["image/jpeg", "image/png", "image/webp"];

    if (!allowed.includes(file.type) || file.size > 5 * 1024 * 1024) {
      alert("Pilih foto JPG, PNG, atau WebP dengan ukuran maksimal 5 MB.");
      photoInput.value = "";
      photoPreview.hidden = true;
      photoPreview.removeAttribute("src");
      return;
    }

    photoPreview.src = URL.createObjectURL(file);
    photoPreview.hidden = false;
  });

  $("activityForm").addEventListener("submit", async event => {
    event.preventDefault();

    const file = photoInput.files[0];
    let photoUrl = "";

    try {
      if (file) {
        if (file.size > 5 * 1024 * 1024) {
          throw new Error("Ukuran foto melebihi 5 MB.");
        }

        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", UPLOAD_PRESET);

        const response = await fetch(
          `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
          { method: "POST", body: formData }
        );

        const result = await response.json();

        if (!response.ok || !result.secure_url) {
          console.error("Cloudinary:", result);
          throw new Error(
            result.error?.message || "Unggahan foto gagal."
          );
        }

        photoUrl = result.secure_url;
      }

      await addDoc(collection(db, "kegiatan"), {
        judul: $("activityTitle").value.trim(),
        tanggal: $("activityDate").value,
        deskripsi: $("activityBody").value.trim(),
        foto: photoUrl,
        dibuatPada: serverTimestamp()
      });

      event.target.reset();
      photoPreview.hidden = true;
      photoPreview.removeAttribute("src");
      alert("Kegiatan berhasil disimpan.");
      await loadContent();
    } catch (error) {
      console.error("Gagal menyimpan kegiatan:", error);
      alert(
        "Gagal menyimpan kegiatan atau mengunggah foto.\n" +
        (error.message || "Periksa Cloud name, preset, dan Firestore Rules.")
      );
    }
  });

} catch (error) {
  console.error("Inisialisasi Firebase gagal:", error);
  status.textContent =
    "Sistem gagal dimulai. Periksa konfigurasi Firebase dan koneksi internet.";
}
</script>
</body>
</html>
