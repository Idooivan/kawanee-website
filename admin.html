
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin KAWANEE</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f2;color:#20352a;margin:0;padding:16px}
main{max-width:760px;margin:auto}
section{background:white;padding:18px;margin:16px 0;border-radius:12px}
input,textarea,select{box-sizing:border-box;width:100%;padding:12px;margin:7px 0 14px;border:1px solid #bbb;border-radius:6px;font:inherit}
button{padding:11px 15px;border:0;border-radius:6px;background:#246b45;color:white;font-size:15px;cursor:pointer;margin:4px 0}
.danger{background:#a52b2b}
.item{border-top:1px solid #ddd;padding:12px 0;overflow-wrap:anywhere}
small{color:#53645a}
</style>
</head>
<body>
<main>
<h1>Admin KAWANEE</h1>
<p>Kelola informasi dan kegiatan organisasi.</p>

<section id="loginSection">
<h2>Login Pengurus</h2>
<form id="loginForm">
<label>Email admin</label>
<input id="email" type="email" autocomplete="username" required>
<label>Kata sandi</label>
<input id="password" type="password" autocomplete="current-password" required>
<button type="submit">Masuk</button>
</form>
<p id="status" role="status">Silakan login.</p>
</section>

<div id="panel" hidden>
<section>
<p id="welcome"></p>
<button id="logout">Keluar</button>
</section>

<section>
<h2>Tambah Informasi</h2>
<form id="infoForm">
<label>Judul informasi</label>
<input id="infoTitle" maxlength="150" required>
<label>Isi informasi</label>
<textarea id="infoBody" rows="4" maxlength="10000" required></textarea>
<button type="submit">Simpan Informasi</button>
</form>
</section>

<section>
<h2>Tambah Kegiatan</h2>
<form id="activityForm">
<label>Nama kegiatan</label>
<input id="activityTitle" maxlength="150" required>
<label>Tanggal kegiatan</label>
<input id="activityDate" type="date" required>
<label>Deskripsi kegiatan</label>
<textarea id="activityBody" rows="4" maxlength="10000" required></textarea>

<label>Foto kegiatan</label>
<input
  id="activityPhoto"
  type="file"
  accept="image/jpeg,image/png,image/webp"
>
<img id="photoPreview" alt="Pratinjau foto"
  hidden style="max-width:100%;max-height:240px;border-radius:8px">
<small>Pilih foto JPG, PNG, atau WebP dari galeri HP. Maksimal 5 MB.</small>
  
<button type="submit">Simpan Kegiatan</button>
</form>
</section>

<section>
<h2>Informasi Tersimpan</h2>
<div id="infoList">Memuat data...</div>
</section>

<section>
<h2>Kegiatan Tersimpan</h2>
<div id="activityList">Memuat data...</div>
</section>
</div>
</main>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {
getFirestore, collection, addDoc, getDocs, deleteDoc, doc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD0j1Xu-1ZHUotuqWBlTc8WkN7NUsd_V1g",
  authDomain: "kawanee-website.firebaseapp.com",
  projectId: "kawanee-website",
  storageBucket: "kawanee-website.firebasestorage.app",
  messagingSenderId: "285839151481",
  appId: "1:285839151481:web:02f2ed0a52f162ed7adfa8" 
};

const ADMIN_UID = "tbv7AC93oaMA7WigsVO858XpHeE2";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const loginSection = $("loginSection");
const panel = $("panel");
const status = $("status");

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  status.textContent = "Memeriksa akun...";
  try {
    await signInWithEmailAndPassword(
      auth, $("email").value.trim(), $("password").value
    );
  } catch {
    status.textContent = "Login gagal. Periksa email, sandi, dan konfigurasi.";
  }
});

onAuthStateChanged(auth, async user => {
  panel.hidden = true;
  loginSection.hidden = !(!user);
  if (!user) {
    status.textContent = "Silakan login sebagai admin.";
    return;
  }
  if (user.uid !== ADMIN_UID) {
    await signOut(auth);
    status.textContent = "Akses ditolak: bukan admin.";
    return;
  }
  panel.hidden = false;
  $("welcome").textContent = "Login sebagai admin: " + user.email;
  status.textContent = "Admin terverifikasi.";
  await loadContent();
});

$("logout").addEventListener("click", () => signOut(auth));

function safeText(tag, value) {
  const el = document.createElement(tag);
  el.textContent = value ?? "";
  return el;
}

async function loadCollection(name, listId, isActivity) {
  const list = $(listId);
  list.replaceChildren();
  try {
    const snap = await getDocs(collection(db, name));
    if (snap.empty) {
      list.textContent = "Belum ada data.";
      return;
    }
    snap.forEach(snapshot => {
      const data = snapshot.data();
      const item = document.createElement("div");
      item.className = "item";
      item.append(
        safeText("h3", data.judul || data.title || "(Tanpa judul)"),
        safeText("p", data.isi || data.deskripsi || ""),
        safeText("small", data.tanggal || "")
      );
      if (data.foto) {
        const link = document.createElement("a");
        link.href = data.foto;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Lihat foto";
        item.append(document.createElement("br"), link);
      }
      const del = document.createElement("button");
      del.className = "danger";
      del.textContent = "Hapus";
      del.addEventListener("click", async () => {
        if (!confirm("Yakin ingin menghapus konten ini?")) return;
        try {
          await deleteDoc(doc(db, name, snapshot.id));
          await loadContent();
        } catch {
          alert("Gagal menghapus. Periksa aturan Firestore.");
        }
      });
      item.append(document.createElement("br"), del);
      list.append(item);
    });
  } catch {
    list.textContent = "Gagal memuat data. Periksa koneksi dan Firestore Rules.";
  }
}

async function loadContent() {
  await loadCollection("informasi", "infoList", false);
  await loadCollection("kegiatan", "activityList", true);
}

$("infoForm").addEventListener("submit", async e => {
  e.preventDefault();
  try {
    await addDoc(collection(db, "informasi"), {
      judul: $("infoTitle").value.trim(),
      isi: $("infoBody").value.trim(),
      dibuatPada: serverTimestamp()
    });
    e.target.reset();
    alert("Informasi berhasil disimpan.");
    await loadContent();
  } catch {
    alert("Gagal menyimpan informasi. Periksa Firestore Rules.");
  }
});


const CLOUD_NAME = "Kawanee_galeri";
const UPLOAD_PRESET = "kawanee_galeri";

const photoInput = document.getElementById("activityPhoto");
const photoPreview = document.getElementById("photoPreview");

photoInput.addEventListener("change", () => {
  const file = photoInput.files[0];

  if (!file) {
    photoPreview.hidden = true;
    photoPreview.removeAttribute("src");
    return;
  }

  const allowed = ["image/jpeg", "image/png", "image/webp"];

  if (!allowed.includes(file.type) || file.size > 5 * 1024 * 1024) {
    alert("Pilih foto JPG, PNG, atau WebP dengan ukuran maksimal 5 MB.");
    photoInput.value = "";
    photoPreview.hidden = true;
    return;
  }

  photoPreview.src = URL.createObjectURL(file);
  photoPreview.hidden = false;
});

$("activityForm").addEventListener("submit", async e => {
  e.preventDefault();

  const file = photoInput.files[0];
  let photoUrl = "";

  try {
    if (file) {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);

      const response = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
        { method: "POST", body: formData }
      );

      const result = await response.json();

      if (!response.ok || !result.secure_url) {
        throw new Error("Unggahan foto gagal.");
      }

      photoUrl = result.secure_url;
    }

    await addDoc(collection(db, "kegiatan"), {
      judul: $("activityTitle").value.trim(),
      tanggal: $("activityDate").value,
      deskripsi: $("activityBody").value.trim(),
      foto: photoUrl,
      dibuatPada: serverTimestamp()
    });

    e.target.reset();
    photoPreview.hidden = true;
    photoPreview.removeAttribute("src");
    alert("Kegiatan berhasil disimpan.");
    await loadContent();
  } catch (error) {
    console.error(error);
    alert("Gagal menyimpan kegiatan atau mengunggah foto. Periksa Cloud name, preset, dan Firestore Rules.");
  }
});
;
  const photo = $("activityPhoto").value.trim();
  if (photo && !/^https?:\/\//i.test(photo)) {
    alert("URL foto harus diawali https:// atau http://");
    return;
  }
  try {
    await addDoc(collection(db, "kegiatan"), {
      judul: $("activityTitle").value.trim(),
      tanggal: $("activityDate").value,
      deskripsi: $("activityBody").value.trim(),
      foto: photo,
      dibuatPada: serverTimestamp()
    });
    e.target.reset();
    alert("Kegiatan berhasil disimpan.");
    await loadContent();
  } catch {
    alert("Gagal menyimpan kegiatan. Periksa Firestore Rules.");
  }
});
</script>
</body>
</html>
